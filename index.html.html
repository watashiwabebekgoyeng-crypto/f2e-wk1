<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2027 New Year Countdown</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            font-weight: bold;

            background:
                radial-gradient(circle at top,#c115d4, hsl(50, 100%, 50%) 60%, #00c8ff);
            overflow: hidden;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            margin-bottom: 15px;
            text-shadow: 0 0 25px #eaff00;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 40px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .time-box {
            min-width: 120px;
            padding: 25px 20px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(255, 238, 0, 0.422);
            backdrop-filter: blur(10px);
        }

        .number {
            display: block;
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .label {
            margin-top: 8px;
            display: block;
            color: #ffffff;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #message {
            display: none;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 25px #ff9900;
        }

        .footer {
            margin-top: 40px;
            color: #ffffff;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👍2027👍</h1>

        <p class="subtitle">Countdown to the New Yeay!!!</p>

        <div id="countdown" class="countdown">

            <div class="time-box">
                <span id="days" class="number">0</span>
                <span class="label">Days</span>
            </div>

            <div class="time-box">
                <span id="hours" class="number">0</span>
                <span class="label">Hours</span>
            </div>

            <div class="time-box">
                <span id="minutes" class="number">0</span>
                <span class="label">Minutes</span>
            </div>

            <div class="time-box">
                <span id="seconds" class="number">0</span>
                <span class="label">Seconds</span>
            </div>

        </div>

        <div id="message">
            🎆 Happy New Yeay 2027! 🎆
        </div>

        <p class="footer">✨🙂 New year, new beginnings 🙂✨</p>

    </div>

    <script>
        // New Year 2027
        const newYear = new Date("January 1, 2027 00:00:00").getTime();

        function updateCountdown() {

            const now = new Date().getTime();
            const difference = newYear - now;

            if (difference <= 0) {

                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";

                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("days").textContent = days;
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        // Update immediately
        updateCountdown();

        // Update every second
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
